databases:
  - name: accounting-agent-db
    plan: free
    region: singapore

services:
  - type: web
    name: accounting-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accounting-agent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: "3000"
      - key: UPLOAD_DIR
        value: /tmp/uploads
