# 実際の本番運用ではRenderの自前Postgres(databases:ブロック)は使っていない。
# Render Postgresの無料プランは30日で自動削除されるため、削除期限のないNeon
# (https://neon.tech, GitHubログインで作成)の無料DBをDATABASE_URLとして
# 手動で設定している。このBlueprintをそのまま適用する場合は、Apply後に
# ダッシュボードのEnvironmentタブでDATABASE_URLをNeonの接続文字列に書き換えること。
services:
  - type: web
    name: accounting-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: "3000"
      - key: UPLOAD_DIR
        value: /tmp/uploads
